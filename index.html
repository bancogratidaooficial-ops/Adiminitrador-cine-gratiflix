<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN CINE</title>
<style>body{background:#000;color:#fff;font-family:Arial;padding:16px}input,button,select,textarea{padding:14px;border-radius:12px;border:none;width:100%;margin:6px 0;font-weight:700}button{cursor:pointer}.card{background:#111;padding:14px;border-radius:14px;margin:10px 0;border:1px solid #222}.tabs{display:flex;gap:8px;margin:12px 0;overflow:auto}.tab{padding:10px 14px;border-radius:20px;background:#222;color:#888;cursor:pointer;white-space:nowrap}.tab.ativo{background:#ff0000;color:#fff}</style>
</head><body>
<div id="login"><h2>🔐 ADMIN CINE GRATIFLIX</h2><input id="senha" type="password" placeholder="Senha"><button onclick="logar()" style="background:#ff0000;color:#fff">ENTRAR</button><small style="color:#555">Senha: cine2024</small></div>
<div id="painel" style="display:none">
<div class="tabs">
<div id="tabFilme" class="tab ativo" onclick="aba('filme')">🎬 FILMES</div>
<div id="tabCodigo" class="tab" onclick="aba('codigo')">🎟️ CÓDIGOS</div>
<div id="tabPedidos" class="tab" onclick="aba('pedidos')">📋 PEDIDOS</div>
</div>
<div id="aba-filme">
<h3>➕ Adicionar Filme</h3>
<input id="f_titulo" placeholder="Nome ex: Tempos Modernos">
<input id="f_ano" placeholder="Ano ex: 1936" type="number">
<select id="f_tag"><option>DOMÍNIO PÚBLICO</option><option>CREATIVE COMMONS</option><option>LANÇAMENTO</option></select>
<input id="f_capa" placeholder="Link da capa (Google Imagens > copiar link da imagem)">
<textarea id="f_video" placeholder="Link do vídeo: YouTube ou archive.org/details/..." rows="3"></textarea>
<input id="f_desc" placeholder="Descrição curta">
<button onclick="addFilme()" style="background:#ffcc00;color:#000">💾 SALVAR FILME</button>
<div id="listaFilmes" style="margin-top:20px"></div>
<button onclick="exportarJSON()" style="background:#333;color:#aaa;margin-top:20px">📤 EXPORTAR filmes.json</button>
<textarea id="jsonOut" style="display:none;margin-top:10px;background:#111;color:#0f0;font-size:11px" rows="8"></textarea>
</div>
<div id="aba-codigo" style="display:none">
<h3>⚡ Gerador de Códigos</h3>
<input id="idCliente" placeholder="ID CINE-123456"><input id="nomeCliente" placeholder="Nome">
<button onclick="gerarCodigoManual()" style="background:#ffcc00;color:#000">GERAR CÓDIGO CINE</button>
<div id="codigoNovo" style="font-size:22px;color:#00ff88;text-align:center;margin-top:10px"></div>
<button id="btnCopiar" onclick="navigator.clipboard.writeText(ultimoCodigo);alert('Copiado '+ultimoCodigo)" style="display:none;background:#00ff88;color:#000">📋 COPIAR CÓDIGO</button>
<button id="btnZap" onclick="enviarZap()" style="display:none;background:#25D366;color:#fff">💬 ENVIAR NO ZAP</button>
</div>
<div id="aba-pedidos" style="display:none"><h3>📋 Pedidos</h3><div id="listaPedidos"></div><button onclick="carregarPedidos()" style="background:#222;color:#fff">🔄 ATUALIZAR</button></div>
</div>
<script>
const SENHA="cine2024";let ultimoCodigo="";let ultimoId="";
function logar(){if(document.getElementById('senha').value===SENHA){document.getElementById('login').style.display='none';document.getElementById('painel').style.display='block';carregarFilmes();carregarPedidos()}else alert('Senha errada')}
function aba(t){document.getElementById('aba-filme').style.display=t==='filme'?'block':'none';document.getElementById('aba-codigo').style.display=t==='codigo'?'block':'none';document.getElementById('aba-pedidos').style.display=t==='pedidos'?'block':'none';document.querySelectorAll('.tab').forEach(x=>x.classList.remove('ativo'));document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('ativo')}
function addFilme(){
 let f={t:document.getElementById('f_titulo').value,ano:document.getElementById('f_ano').value,tag:document.getElementById('f_tag').value,img:document.getElementById('f_capa').value||'https://images.unsplash.com/photo-1485846234645-a62644f84728',video:document.getElementById('f_video').value,desc:document.getElementById('f_desc').value,id:Date.now()};
 if(!f.t||!f.video){alert('Preencha nome e link do vídeo');return}
 let filmes=JSON.parse(localStorage.getItem('cine_filmes')||'[]');filmes.push(f);localStorage.setItem('cine_filmes',JSON.stringify(filmes));alert('✅ Filme '+f.t+' salvo!');document.getElementById('f_titulo').value='';document.getElementById('f_video').value='';carregarFilmes();
}
function carregarFilmes(){let filmes=JSON.parse(localStorage.getItem('cine_filmes')||'[]');let html=`<h4>${filmes.length} filmes no celular</h4>`;filmes.slice().reverse().forEach(f=>{html+=`<div class="card"><img src="${f.img}" style="width:100%;height:100px;object-fit:cover;border-radius:10px"><br><b>${f.t} (${f.ano})</b><br><small style="color:#888">${f.tag}</small><br><button onclick="removerFilme(${f.id})" style="background:#300;color:#f55;padding:8px;margin-top:6px">🗑️ REMOVER</button></div>`});document.getElementById('listaFilmes').innerHTML=html}
function removerFilme(id){let f=JSON.parse(localStorage.getItem('cine_filmes')||'[]').filter(x=>x.id!==id);localStorage.setItem('cine_filmes',JSON.stringify(f));carregarFilmes()}
function exportarJSON(){let f=localStorage.getItem('cine_filmes')||'[]';document.getElementById('jsonOut').style.display='block';document.getElementById('jsonOut').value=f;}
function gerarCodigoManual(){
 let id=document.getElementById('idCliente').value.trim().toUpperCase()||'CINE-'+Date.now().toString().slice(-6);let codigo=`CINE-${Math.random().toString(36).substring(2,6).toUpperCase()}-${Math.random().toString(36).substring(2,6).toUpperCase()}`;ultimoCodigo=codigo;ultimoId=id;
 let libs=JSON.parse(localStorage.getItem('cine_liberados')||'{}');libs[id]=codigo;localStorage.setItem('cine_liberados',JSON.stringify(libs));
 let pedidos=JSON.parse(localStorage.getItem('cine_pedidos')||'[]');let p=pedidos.find(x=>x.id===id);if(p){p.codigo=codigo;p.status='liberado';localStorage.setItem('cine_pedidos',JSON.stringify(pedidos))}
 document.getElementById('codigoNovo').innerHTML=`ID: ${id}<br><b style="font-size:28px">${codigo}</b>`;document.getElementById('btnCopiar').style.display='block';document.getElementById('btnZap').style.display='block';carregarPedidos();
}
function enviarZap(){let msg=`🎉 CINE GRATIFLIX LIBERADO! 🎉\n\nID: ${ultimoId}\nCódigo: ${ultimoCodigo}\n\nCole no app e aproveite!`;window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank')}
function carregarPedidos(){let p=JSON.parse(localStorage.getItem('cine_pedidos')||'[]');let h='';if(p.length===0)h='<p style="color:#666">Nenhum pedido neste celular. Use o ID que a pessoa mandou no grupo no gerador.</p>';p.slice().reverse().forEach(x=>{h+=`<div class="card"><b>${x.nome} - ${x.id}</b><br><small>${x.data} - ${x.wpp}</small><br><button onclick="document.getElementById('idCliente').value='${x.id}';aba('codigo');gerarCodigoManual()" style="background:#0f8;color:#000">LIBERAR ESSE</button></div>`});document.getElementById('listaPedidos').innerHTML=h}
</script>
</body></html>
